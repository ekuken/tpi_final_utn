<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel - Gestión de Inventario</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <div class="topbar">
            <div>
                <h1>Panel general</h1>
                <p>Resumen del estado actual del inventario</p>
            </div>
        </div>

        <div id="alerta" class="alert error hidden"></div>
        <div id="aviso-stock" class="alert warning hidden"></div>

        <div class="stat-grid cols-3" id="stat-grid">
            <div class="stat-card">
                <div class="stat-value">-</div>
                <div class="stat-label">Cargando...</div>
            </div>
        </div>

        <div class="card">
            <h3>⚠️ Productos con stock bajo</h3>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Producto</th>
                        <th>Stock actual</th>
                        <th>Stock mínimo</th>
                        <th>Proveedor</th>
                        <th class="text-right">Acción</th>
                    </tr>
                </thead>
                <tbody id="tbody-stock-bajo">
                    <tr><td colspan="6" class="empty-state">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
    initLayout("dashboard");

    function statCard(valor, etiqueta, clase = "") {
        return `
            <div class="stat-card ${clase}">
                <div class="stat-value">${valor}</div>
                <div class="stat-label">${etiqueta}</div>
            </div>`;
    }

    function mostrarAvisoStock(reporte) {
        const aviso = document.getElementById("aviso-stock");
        if (reporte.productosConStockBajo === 0) {
            aviso.classList.add("hidden");
            return;
        }
        const sinStock = reporte.productosSinStock > 0
            ? ` (<strong>${reporte.productosSinStock} sin stock</strong>)` : "";
        aviso.innerHTML = `
            <span>⚠️ Hay <strong>${reporte.productosConStockBajo}</strong> producto(s) con stock bajo${sinStock}.
            Podés generar una orden de compra al proveedor desde la tabla de abajo.</span>
            <a href="ordenes-compra.html" class="btn secondary">Ir a órdenes de compra</a>`;
        aviso.classList.remove("hidden");
    }

    async function cargarDashboard() {
        try {
            const reporte = await Api.get("/reportes/inventario");
            ocultarAlerta("alerta");
            mostrarAvisoStock(reporte);

            document.getElementById("stat-grid").innerHTML =
                statCard(reporte.totalProductos, "Productos activos") +
                statCard(reporte.totalUnidadesEnStock, "Unidades en stock") +
                statCard(formatearMoneda(reporte.valorTotalInventario), "Valor del inventario (a precio de venta)") +
                statCard(formatearMoneda(reporte.ventasDelMes), `Ventas del mes (${reporte.cantidadVentasDelMes})`) +
                statCard(reporte.ordenesCompraPendientes, "Órdenes de compra pendientes") +
                statCard(reporte.productosConStockBajo, "Productos con stock bajo",
                    reporte.productosSinStock > 0 ? "danger" : "warning");

            const tbody = document.getElementById("tbody-stock-bajo");
            if (reporte.detalleStockBajo.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No hay productos con stock bajo 🎉</td></tr>`;
            } else {
                tbody.innerHTML = reporte.detalleStockBajo.map((p) => `
                    <tr>
                        <td>${escapeHtml(p.codigo)}</td>
                        <td>${escapeHtml(p.nombre)}</td>
                        <td><span class="badge ${p.stock === 0 ? "danger" : "warn"}">${p.stock === 0 ? "Sin stock" : p.stock}</span></td>
                        <td>${p.stockMinimo}</td>
                        <td>${escapeHtml(p.proveedorNombre || "-")}</td>
                        <td class="text-right">
                            ${p.proveedorId
                                ? `<a href="ordenes-compra.html?proveedorId=${p.proveedorId}" class="btn secondary">Pedir al proveedor</a>`
                                : '<span class="text-muted">Sin proveedor</span>'}
                        </td>
                    </tr>
                `).join("");
            }
        } catch (err) {
            mostrarError("alerta", err.message);
        }
    }

    cargarDashboard();
</script>

</body>
</html>
